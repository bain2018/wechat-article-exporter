name: wechat-article-exporter-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.compose
    container_name: wechat-article-exporter-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_KV_DRIVER: fs
      NITRO_KV_BASE: .data/kv
      NUXT_DEBUG_MP_REQUEST: "false"
      NUXT_PUBLIC_CREDENTIAL_PUBLIC_HOST: ${NUXT_PUBLIC_CREDENTIAL_PUBLIC_HOST:-http://home.mohe.ai}
      NUXT_PUBLIC_CREDENTIAL_API_HOST: ${NUXT_PUBLIC_CREDENTIAL_API_HOST:-}
      NUXT_PUBLIC_CREDENTIAL_WS_URL: ${NUXT_PUBLIC_CREDENTIAL_WS_URL:-}
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-true}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      APP_AUTH_SESSION_TTL_SECONDS: ${APP_AUTH_SESSION_TTL_SECONDS:-604800}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      STORAGE_DRIVER: postgres-minio
      DATABASE_URL: postgres://whoisurdaddy:facai188!@postgres:5432/wechat_article_exporter
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: whoisurdaddy
      MINIO_SECRET_KEY: facai188!
      MINIO_BUCKET: wechat-article-exporter
      MINIO_REGION: us-east-1
      PDF_RENDER_CONCURRENCY: ${PDF_RENDER_CONCURRENCY:-2}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-120000}
      PDF_EXPORT_MAX_ARTICLES: ${PDF_EXPORT_MAX_ARTICLES:-20}
      PDF_LEGACY_MAX_BODY_BYTES: ${PDF_LEGACY_MAX_BODY_BYTES:-33554432}
      PDF_RESOURCE_FETCH_CONCURRENCY: ${PDF_RESOURCE_FETCH_CONCURRENCY:-6}
      PDF_RESOURCE_READ_CONCURRENCY: ${PDF_RESOURCE_READ_CONCURRENCY:-8}
      PDF_RESOURCE_FETCH_TIMEOUT_MS: ${PDF_RESOURCE_FETCH_TIMEOUT_MS:-15000}
      PDF_RESOURCE_MAX_BYTES: ${PDF_RESOURCE_MAX_BYTES:-10485760}
      PDF_RESOURCE_MAX_TOTAL_BYTES: ${PDF_RESOURCE_MAX_TOTAL_BYTES:-134217728}
      PDF_RESOURCE_FETCH_MAX_COUNT: ${PDF_RESOURCE_FETCH_MAX_COUNT:-200}
      PDF_RESOURCE_ALLOWED_HOSTS: ${PDF_RESOURCE_ALLOWED_HOSTS:-qpic.cn,qlogo.cn,qq.com,gtimg.cn,weixinbridge.com}
      PUPPETEER_NO_SANDBOX: ${PUPPETEER_NO_SANDBOX:-false}
    ports:
      - "3100:3000"
    volumes:
      - /app/data/wechat:/app/.data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/auth/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: wechat-article-exporter-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: whoisurdaddy
      POSTGRES_PASSWORD: facai188!
      POSTGRES_DB: wechat_article_exporter
    ports:
      - "2354:5432"
    volumes:
      - /app/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoisurdaddy -d wechat_article_exporter"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: wechat-article-exporter-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whoisurdaddy
      MINIO_ROOT_PASSWORD: facai188!
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - /app/data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app-kv:
  postgres-data:
  minio-data:
